name: Vehicle history and traffic regressions
on:
  push:
    branches:
      - dev/vehicle-history-map-20261009
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for file in app.js core.js vehicle-history.js traffic-analysis.js sw.js scripts/build-vercel.mjs; do node --check "$file"; done
      - name: Exercise observed vehicle history and traffic logic
        run: node tests/vehicle_traffic.cjs

      - name: Verify existing route and source regressions
        run: node tests/logic_regressions.cjs
      - name: Build and verify standalone DEV site assets
        run: node scripts/build-vercel.mjs
