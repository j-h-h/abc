name: Vehicle history and traffic regressions
on:
  push:
    branches:
      - dev/vehicle-history-map-20261009
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for file in app.js core.js vehicle-history.js traffic-analysis.js sw.js live-contract.js api/live.mjs scripts/build-vercel.mjs; do node --check "$file"; done
      - name: Exercise observed vehicle history and traffic logic
        run: node tests/vehicle_traffic.cjs

      - name: Verify existing route and source regressions
        run: node tests/logic_regressions.cjs
      - name: Build and verify standalone DEV site assets
        run: node scripts/build-vercel.mjs
      - name: Verify DEV to WORK gateway contract
        run: node tests/live_integration.cjs
      - name: Install browser runner
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify real browser through existing WORK service
        run: node tests/dev_live_browser.cjs
      - name: Save DEV browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-live-browser
          path: dev-live-*.png
          if-no-files-found: ignore
