name: Vehicle history and traffic regressions
on:
  push:
    branches:
      - dev/vehicle-history-map-20261009
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for file in app.js experience.js gtfs-store.js national.js traffic-tiles.js national-contract.js traffic-view.js core.js vehicle-history.js traffic-analysis.js sw.js live-contract.js archive-contract.js api/live.mjs api/national.mjs api/search.mjs api/dataset.mjs api/traffic.mjs backend/national/providers.mjs backend/national/transit.mjs backend/national/geometry.mjs scripts/build-vercel.mjs; do node --check "$file"; done
      - name: Exercise observed vehicle history and traffic logic
        run: |
          node tests/bus_marker.cjs
          node tests/vehicle_traffic.cjs
          node tests/traffic_gateway.cjs

      - name: Verify existing route and source regressions
        run: node tests/logic_regressions.cjs
      - name: Build and verify standalone DEV site assets
        run: node scripts/build-vercel.mjs
      - name: Verify DEV to WORK gateway contract
        run: |
          node tests/live_integration.cjs
          node tests/archive_contract.cjs
          node tests/national_contract.cjs
          node tests/dataset_refresh.cjs
          node tests/metadata_wait.cjs
      - name: Install browser runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify nationwide browser, address search and combined map
        run: node tests/dev_national_browser.cjs
      - name: Save DEV browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-live-browser-${{ github.sha }}
          path: dev-national-*.png
          if-no-files-found: ignore

  public-dev:
    if: contains(github.event.head_commit.message, '[verify-public]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
      - name: Build verified GTFS for browser runner
        run: node scripts/build-vercel.mjs
      - name: Install matching browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify canonical public DEV in desktop and mobile
        env:
          DEV_BASE_URL: https://eifo-batuach-dev.vercel.app
        run: node tests/dev_national_browser.cjs
      - name: Save public DEV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-public-browser-${{ github.sha }}
          path: dev-public-*.png
          if-no-files-found: ignore
