name: Update GTFS and deploy bus app
on:
  workflow_dispatch:
  repository_dispatch:
    types: [eifo-batuach-update]
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/eifo-batuach.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dedicated site branch
        uses: actions/checkout@v4
        with:
          ref: eifo-batuach-site
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official GTFS
        run: |
          curl -fL --retry 4 --retry-delay 12 --connect-timeout 20 --max-time 600 -o /tmp/israel-gtfs.zip https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip
          unzip -t /tmp/israel-gtfs.zip | tail -1
      - name: Build separate route files
        run: python build_catalog.py /tmp/israel-gtfs.zip data
      - name: Bundle pinned Leaflet locally
        run: |
          npm pack leaflet@1.9.4 --silent >/tmp/leaflet-package-name.txt
          tar -xzf "$(cat /tmp/leaflet-package-name.txt)" package/dist/leaflet.js package/dist/leaflet.css package/dist/images
          mkdir -p vendor
          cp package/dist/leaflet.js vendor/leaflet.js
          cp package/dist/leaflet.css vendor/leaflet.css
          cp -R package/dist/images vendor/images
          rm -rf package leaflet-1.9.4.tgz
      - name: Prepare Pages artifact
        run: |
          rm -f data/all-israel-lines.zip
          touch .nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test public site and bus route 72
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          def get(path):
              u=base+path
              last=None
              for attempt in range(9):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'EifoBatuach-smoke/1.0'}),timeout=18) as r:
                          data=r.read()
                          print('GET',path,'HTTP',r.status,'bytes',len(data))
                          return data
                  except Exception as e:
                      last=e; print('retry',path,attempt,str(e));time.sleep(5)
              raise RuntimeError(f'URL FAILED: {u} {last}')
          page=get('index.html').decode('utf-8')
          assert 'איפה בטוח' in page and 'gtfs-store.js' in page
          js=get('vendor/leaflet.js')
          assert b'L.Control' in js or b'Leaflet' in js
          css=get('vendor/leaflet.css')
          assert b'.leaflet' in css
          manifest=json.loads(get('data/version.json'))
          catalog=json.loads(get('data/catalog.json'))
          routes=json.loads(get('data/line/72.json'))
          assert catalog.get('schema')==2 and '72' in catalog.get('lines',[])
          matched=[x for x in routes if '2360' in x.get('c',[])]
          assert matched, 'Missing stop 2360 on 72 route'
          assert all(len(x.get('x',''))>20 for x in matched)
          print('PUBLIC SITE OK',base,'feed',manifest.get('version'),'line 72 matched routes',len(matched))
          PY