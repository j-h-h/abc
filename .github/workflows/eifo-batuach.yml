name: Notify bus site changes
on:
  push:
    branches: [eifo-batuach-site]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment from default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl -fsS --retry 2 --request POST \
            --url "https://api.github.com/repos/$GH_REPOSITORY/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"eifo-batuach-update"}'
